<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Coconut Reviews</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(117, 153, 75, 0.10),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 85%,
            rgba(117, 153, 75, 0.08),
            transparent 35%
        ),
        #f3f6ed;
    color: #243321;
    line-height: 1.5;
}

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px 60px;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 40px;
      margin-bottom: 8px;
      color: #243321;
    }

    .header p {
      color: #70757a;
      font-size: 17px;
    }


    /* =====================================================
       RATING SUMMARY
       ===================================================== */

    .rating-summary {
        background: rgba(255, 255, 255, 0.94);

        border: 1px solid rgba(117, 153, 75, 0.18);

      border-radius: 18px;

      padding: 28px;

      margin-bottom: 25px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 30px;

      box-shadow:
        0 3px 15px rgba(0, 0, 0, 0.08);
    }

    .rating-number {
      font-size: 48px;
      font-weight: bold;
    }

    .stars-display {
      color: #fbbc04;

      font-size: 25px;

      letter-spacing: 2px;

      margin-top: 3px;
    }

    .review-count {
      color: #777;

      margin-top: 5px;
    }

    .rating-message {
      color: #666;

      max-width: 300px;
    }

    .rating-message strong {
      font-size: 18px;

      color: #314329;
    }


    /* =====================================================
       MAIN REVIEW FORM
       ===================================================== */

    .review-form {
      background: rgba(255, 255, 255, 0.96);

    border: 1px solid rgba(117, 153, 75, 0.16);

      padding: 30px;

      border-radius: 18px;

      margin-bottom: 30px;

      box-shadow:
        0 3px 15px rgba(0, 0, 0, 0.08);
    }

    .review-form > h2 {
      font-size: 28px;

      margin-bottom: 28px;
    }


    /* =====================================================
       TWO COLUMN GRID
       ===================================================== */

    .review-grid {

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: 35px;

      align-items: start;
    }


    /* =====================================================
       LEFT COLUMN
       ===================================================== */

    .review-left {
      width: 100%;
    }


    /* =====================================================
       RIGHT COLUMN
       ===================================================== */

    .review-right {

      width: 100%;

      display: flex;

      flex-direction: column;

      gap: 25px;
    }


    /* =====================================================
       FORM GROUP
       ===================================================== */

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;

      margin-bottom: 8px;

      font-weight: bold;

      font-size: 17px;
    }

    input[type="text"],
    textarea {

      width: 100%;

      padding: 14px 15px;

      border:
        1px solid #dadce0;

      border-radius: 10px;

      font-size: 16px;

      outline: none;

      transition: 0.2s;
    }

    input[type="text"]:focus,
    textarea:focus {

      border-color: #75994b;

      box-shadow:
        0 0 0 3px
        rgba(117, 153, 75, 0.14);
    }

    textarea {

      min-height: 150px;

      resize: vertical;
    }


    /* =====================================================
       STAR INPUT
       ===================================================== */

    .star-input {

      display: flex;

      flex-direction: row-reverse;

      justify-content: flex-end;

      gap: 2px;

      width: fit-content;
    }

    .star-input input {
      display: none;
    }

    .star-input label {

      font-size: 40px;

      color: #d5d5d5;

      cursor: pointer;

      transition: 0.15s;

      margin: 0;
    }

    .star-input label:hover,
    .star-input label:hover ~ label,
    .star-input input:checked ~ label {

      color: #fbbc04;
    }


    /* =====================================================
       SUBMIT BUTTON
       ===================================================== */

    .submit-button {

      width: 100%;

      padding: 15px;

      background: #75994b;

      color: white;

      border: none;

      border-radius: 10px;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 5px;

      transition: 0.2s;
    }

    .submit-button:hover {
    background: #5f813b;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(95, 129, 59, 0.22);
   }
    .submit-button:disabled {

      background: #aaa;

      cursor: not-allowed;
    }

    #status {

      margin-top: 14px;

      text-align: center;

      font-weight: bold;

      min-height: 22px;
    }


    /* =====================================================
       RIGHT SIDE BOXES
       ===================================================== */

    .media-section,
    .customer-reviews-section {

      background: rgba(248, 251, 244, 0.95);

    border:
        1px solid rgba(117, 153, 75, 0.18);

    box-shadow:
        0 8px 25px rgba(48, 70, 38, 0.05);

      border-radius: 15px;

      padding: 22px;
    }

    .media-section h3,
    .customer-reviews-section h3 {

      font-size: 21px;

      margin-bottom: 17px;

      color: #202124;
    }


    /* =====================================================
       MEDIA BUTTONS
       ===================================================== */

    .media-buttons {

      display: flex;

      gap: 12px;

      flex-wrap: wrap;
    }

    .media-button {

      padding: 11px 17px;

      border:
        1px solid #dadce0;

      border-radius: 9px;

      background: white;

      cursor: pointer;

      font-size: 15px;

      font-weight: 600;

      transition: 0.2s;
    }

    .media-button:hover {

      background: #f8f9fa;

      transform: translateY(-1px);
    }

    .photo-button:hover {

    border-color: #75994b;

    color: #75994b;

    background: #f4f7ee;

    transform: translateY(-2px);
}

.video-button:hover {

    border-color: #75994b;

    color: #75994b;

    background: #f4f7ee;

    transform: translateY(-2px);
}

    input[type="file"] {
      display: none;
    }

    .media-info {

      display: block;

      margin-top: 9px;

      color: #777;

      font-size: 13px;
    }


    /* =====================================================
       MEDIA PREVIEW
       ===================================================== */

    .media-preview {

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 12px;

      margin-top: 18px;
    }

    .preview-item {

      position: relative;

      overflow: hidden;

      border-radius: 10px;

      background: #eee;

      aspect-ratio: 1 / 1;
    }

    .preview-item img,
    .preview-item video {

      width: 100%;

      height: 100%;

      object-fit: cover;
    }

    .remove-media {

      position: absolute;

      top: 6px;

      right: 6px;

      width: 29px;

      height: 29px;

      border: none;

      border-radius: 50%;

      background:
        rgba(0, 0, 0, 0.75);

      color: white;

      font-size: 18px;

      cursor: pointer;

      z-index: 2;
    }

    .remove-media:hover {

      background: #d93025;
    }


    /* =====================================================
       CUSTOMER REVIEWS LIST
       ===================================================== */

    .reviews-list {

      display: flex;

      flex-direction: column;

      gap: 15px;

      max-height: 650px;

      overflow-y: auto;

      padding-right: 5px;
    }


    /* Scrollbar */

    .reviews-list::-webkit-scrollbar {
      width: 6px;
    }

    .reviews-list::-webkit-scrollbar-track {

      background: #edf2e7;

      border-radius: 10px;
    }

    .reviews-list::-webkit-scrollbar-thumb {

      background: #9caf82;

      border-radius: 10px;
    }


    /* =====================================================
       REVIEW CARD
       ===================================================== */

    .review-card {

    background: rgba(255, 255, 255, 0.95);

    border:
        1px solid rgba(117, 153, 75, 0.16);

    border-radius: 12px;

    padding: 17px;

    box-shadow:
        0 6px 20px rgba(48, 70, 38, 0.05);

    margin: 0;

    transition: 0.25s ease;
  }

  .review-card:hover {
    border-color: rgba(117, 153, 75, 0.45);

    transform: translateY(-3px);

    box-shadow:
        0 12px 28px rgba(48, 70, 38, 0.10);
}

    .review-top {

      display: flex;

      align-items: center;

      gap: 10px;

      margin-bottom: 9px;
    }

    .avatar {

      width: 42px;

      height: 42px;

      border-radius: 50%;

      background: #75994b;

      color: white;

      display: flex;

      justify-content: center;

      align-items: center;

      font-size: 17px;

      font-weight: bold;

      flex-shrink: 0;
    }

    .reviewer-name {

      font-size: 15px;

      font-weight: bold;
    }

    .reviewer-role {

      color: #777;

      font-size: 12px;
    }

    .review-date {

      margin-left: auto;

      color: #888;

      font-size: 11px;
    }

    .review-stars {

      color: #fbbc04;

      font-size: 17px;

      letter-spacing: 1px;

      margin-bottom: 6px;
    }

    .review-text {

      color: #444;

      white-space: pre-wrap;

      font-size: 14px;

      margin-bottom: 8px;
    }


    /* =====================================================
       REVIEW MEDIA
       ===================================================== */

    .review-media {

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 7px;

      margin-top: 10px;
    }

    .review-media img,
    .review-media video {

      width: 100%;

      height: 120px;

      border-radius: 8px;

      object-fit: cover;

      background: #eee;
    }

    .review-media img {

      cursor: pointer;

      transition: 0.2s;
    }

    .review-media img:hover {

      transform: scale(1.02);
    }


    /* =====================================================
       DELETE BUTTON
       ===================================================== */

    .delete-review {

      margin-top: 10px;

      padding: 7px 11px;

      border:
        1px solid #e0e0e0;

      border-radius: 8px;

      background: white;

      color: #d93025;

      cursor: pointer;

      font-size: 12px;

      font-weight: 600;

      transition: 0.2s;
    }

    .delete-review:hover {

      background: #fff1f0;

      border-color: #d93025;
    }

    .delete-review:disabled {

      opacity: 0.5;

      cursor: not-allowed;
    }


    /* =====================================================
       EMPTY / LOADING
       ===================================================== */

    .empty-message {

      background: white;

      border-radius: 10px;

      padding: 30px 15px;

      text-align: center;

      color: #777;
    }

    .empty-message h3 {

      color: #333;

      margin-bottom: 5px;
    }

    .loading {

      text-align: center;

      padding: 30px 10px;

      color: #777;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 800px) {

      .review-grid {

        grid-template-columns: 1fr;

        gap: 25px;
      }

      .review-right {

        width: 100%;
      }

      .reviews-list {

        max-height: none;
      }

    }


    @media (max-width: 600px) {

      .container {

        padding:
          20px 12px 40px;
      }

      .header h1 {

        font-size: 29px;
      }

      .rating-summary {

        flex-direction: column;

        text-align: center;
      }

      .rating-message {

        max-width: none;
      }

      .review-form {

        padding: 20px;
      }

      .review-form > h2 {

        font-size: 24px;
      }

      .media-preview {

        grid-template-columns: 1fr 1fr;
      }

      .review-media {

        grid-template-columns: 1fr 1fr;
      }

    }

  </style>
</head>


<body>

  <div class="container">


    <!-- =================================================
         HEADER
         ================================================= -->

    <div class="header">

      <h1>
        ⭐ Customer Reviews
      </h1>

      <p>
        Share your experience with us
      </p>

    </div>


    <!-- =================================================
         RATING SUMMARY
         ================================================= -->

    <div class="rating-summary">

      <div>

        <div
          class="rating-number"
          id="averageRating"
        >
          0.0
        </div>

        <div
          class="stars-display"
          id="averageStars"
        >
          ☆☆☆☆☆
        </div>

        <div
          class="review-count"
          id="reviewCount"
        >
          0 reviews
        </div>

      </div>


      <div class="rating-message">

        <strong>
          What people are saying
        </strong>

        <p>
          Your feedback helps us improve.
        </p>

      </div>

    </div>


    <!-- =================================================
         WRITE REVIEW
         ================================================= -->

    <div class="review-form">

      <h2>
        Write a Review
      </h2>


      <div class="review-grid">


        <!-- =============================================
             LEFT COLUMN
             ============================================= -->

        <div class="review-left">


          <!-- NAME -->

          <div class="form-group">

            <label for="name">
              Your Name
            </label>

            <input
              type="text"
              id="name"
              placeholder="Enter your name"
              maxlength="100"
            >

          </div>


          <!-- ROLE -->

          <div class="form-group">

            <label for="role">
              Role / Position
            </label>

            <input
              type="text"
              id="role"
              placeholder="Example: Student, Customer, Developer"
              maxlength="100"
            >

          </div>


          <!-- RATING -->

          <div class="form-group">

            <label>
              Your Rating
            </label>


            <div class="star-input">

              <input
                type="radio"
                id="star5"
                name="rating"
                value="5"
              >

              <label for="star5">
                ★
              </label>


              <input
                type="radio"
                id="star4"
                name="rating"
                value="4"
              >

              <label for="star4">
                ★
              </label>


              <input
                type="radio"
                id="star3"
                name="rating"
                value="3"
              >

              <label for="star3">
                ★
              </label>


              <input
                type="radio"
                id="star2"
                name="rating"
                value="2"
              >

              <label for="star2">
                ★
              </label>


              <input
                type="radio"
                id="star1"
                name="rating"
                value="1"
              >

              <label for="star1">
                ★
              </label>

            </div>

          </div>


          <!-- REVIEW -->

          <div class="form-group">

            <label for="review">
              Your Review
            </label>

            <textarea
              id="review"
              placeholder="Write your experience..."
              maxlength="2000"
            ></textarea>

          </div>


          <!-- SUBMIT -->

          <button
            type="button"
            id="submitButton"
            class="submit-button"
          >
            Submit Review
          </button>


          <div id="status"></div>


        </div>


        <!-- =============================================
             RIGHT COLUMN
             ============================================= -->

        <div class="review-right">


          <!-- ===========================================
               PHOTOS / VIDEOS
               =========================================== -->

          <div class="media-section">

            <h3>
              Add Photos / Videos
            </h3>


            <div class="media-buttons">

              <button
                type="button"
                class="media-button photo-button"
                id="photoButton"
              >
                📷 Add Photos
              </button>


              <button
                type="button"
                class="media-button video-button"
                id="videoButton"
              >
                🎥 Add Videos
              </button>

            </div>


            <!-- PHOTO INPUT -->

            <input
              type="file"
              id="photoInput"
              accept="image/jpeg,image/png,image/webp"
              multiple
            >


            <!-- VIDEO INPUT -->

            <input
              type="file"
              id="videoInput"
              accept="video/mp4,video/webm,video/quicktime"
              multiple
            >


            <span class="media-info">

              Maximum 5 files total
              • Photos up to 10 MB
              • Videos up to 50 MB

            </span>


            <!-- MEDIA PREVIEW -->

            <div
              id="mediaPreview"
              class="media-preview"
            ></div>

          </div>


          <!-- ===========================================
               CUSTOMER REVIEWS
               =========================================== -->

          <div class="customer-reviews-section">

            <h3>
              Customer Reviews
            </h3>


            <div
              id="reviewsList"
              class="reviews-list"
            >

              <div class="loading">
                Loading reviews...
              </div>

            </div>

          </div>


        </div>

      </div>

    </div>

  </div>


  <!-- =================================================
       FIREBASE + JAVASCRIPT
       ================================================= -->

  <script type="module">


    /* =================================================
       FIREBASE IMPORTS
       ================================================= */

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp,
      deleteDoc,
      doc
    } from
      "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    import {
      getAuth,
      signInAnonymously
    } from
      "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    /* =================================================
       FIREBASE CONFIG
       ================================================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyCOmaO1flAEwaHo6xDhlIK4l0F06NOlrsE",

      authDomain:
        "coconut-reviews.firebaseapp.com",

      projectId:
        "coconut-reviews",

      storageBucket:
        "coconut-reviews.firebasestorage.app",

      messagingSenderId:
        "125704680234",

      appId:
        "1:125704680234:web:203df97afaa9e2f9582453",

      measurementId:
        "G-NQRDBTPJ30"

    };


    /* =================================================
       CLOUDINARY
       ================================================= */

    const CLOUDINARY_CLOUD_NAME =
      "f2ohid2v";

    const CLOUDINARY_UPLOAD_PRESET =
      "Coconut_reviews";


    /* =================================================
       INITIALIZE FIREBASE
       ================================================= */

    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);

    const auth =
      getAuth(app);


    /* =================================================
       DOM ELEMENTS
       ================================================= */

    const nameInput =
      document.getElementById("name");

    const roleInput =
      document.getElementById("role");

    const reviewInput =
      document.getElementById("review");

    const submitButton =
      document.getElementById("submitButton");

    const status =
      document.getElementById("status");

    const photoButton =
      document.getElementById("photoButton");

    const videoButton =
      document.getElementById("videoButton");

    const photoInput =
      document.getElementById("photoInput");

    const videoInput =
      document.getElementById("videoInput");

    const mediaPreview =
      document.getElementById("mediaPreview");

    const reviewsList =
      document.getElementById("reviewsList");

    const averageRating =
      document.getElementById("averageRating");

    const averageStars =
      document.getElementById("averageStars");

    const reviewCount =
      document.getElementById("reviewCount");


    /* =================================================
       SELECTED MEDIA
       ================================================= */

    let selectedMedia = [];


    /* =================================================
       AUTHENTICATION
       ================================================= */

    async function startAuthentication() {

      try {

        if (!auth.currentUser) {

          await signInAnonymously(auth);

        }

        console.log(
          "Anonymous UID:",
          auth.currentUser.uid
        );

      } catch (error) {

        console.error(
          "Authentication error:",
          error
        );

        status.textContent =
          "Authentication failed. Please refresh.";

        status.style.color =
          "#d93025";

        submitButton.disabled =
          true;

      }

    }


    /* =================================================
       PHOTO BUTTON
       ================================================= */

    photoButton.addEventListener(
      "click",
      () => {

        photoInput.click();

      }
    );


    /* =================================================
       VIDEO BUTTON
       ================================================= */

    videoButton.addEventListener(
      "click",
      () => {

        videoInput.click();

      }
    );


    /* =================================================
       PHOTO SELECTION
       ================================================= */

    photoInput.addEventListener(
      "change",
      () => {

        const files =
          Array.from(
            photoInput.files
          );

        addMedia(files);

        photoInput.value = "";

      }
    );


    /* =================================================
       VIDEO SELECTION
       ================================================= */

    videoInput.addEventListener(
      "change",
      () => {

        const files =
          Array.from(
            videoInput.files
          );

        addMedia(files);

        videoInput.value = "";

      }
    );


    /* =================================================
       ADD MEDIA
       ================================================= */

    function addMedia(files) {

      for (const file of files) {


        /* MAX 5 */

        if (
          selectedMedia.length >= 5
        ) {

          alert(
            "Maximum 5 photos/videos allowed."
          );

          break;

        }


        /* PHOTO SIZE */

        if (
          file.type.startsWith("image/")
        ) {

          if (
            file.size >
            10 * 1024 * 1024
          ) {

            alert(
              `${file.name} is larger than 10 MB.`
            );

            continue;

          }

        }


        /* VIDEO SIZE */

        if (
          file.type.startsWith("video/")
        ) {

          if (
            file.size >
            50 * 1024 * 1024
          ) {

            alert(
              `${file.name} is larger than 50 MB.`
            );

            continue;

          }

        }


        selectedMedia.push(
          file
        );

      }


      renderMediaPreview();

    }


    /* =================================================
       MEDIA PREVIEW
       ================================================= */

    function renderMediaPreview() {

      mediaPreview.innerHTML =
        "";


      selectedMedia.forEach(
        (file, index) => {


          const preview =
            document.createElement(
              "div"
            );

          preview.className =
            "preview-item";


          const objectURL =
            URL.createObjectURL(
              file
            );


          let mediaElement;


          if (
            file.type.startsWith("image/")
          ) {

            mediaElement =
              document.createElement(
                "img"
              );

            mediaElement.src =
              objectURL;

          } else {

            mediaElement =
              document.createElement(
                "video"
              );

            mediaElement.src =
              objectURL;

            mediaElement.controls =
              true;

          }


          const removeButton =
            document.createElement(
              "button"
            );

          removeButton.type =
            "button";

          removeButton.className =
            "remove-media";

          removeButton.textContent =
            "×";


          removeButton.addEventListener(
            "click",
            () => {

              selectedMedia.splice(
                index,
                1
              );

              renderMediaPreview();

            }
          );


          preview.appendChild(
            mediaElement
          );

          preview.appendChild(
            removeButton
          );


          mediaPreview.appendChild(
            preview
          );

        }
      );

    }


    /* =================================================
       CLOUDINARY UPLOAD
       ================================================= */

    async function uploadMedia(file) {

      let resourceType =
        "image";


      if (
        file.type.startsWith("video/")
      ) {

        resourceType =
          "video";

      }


      const uploadURL =
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`;


      const formData =
        new FormData();


      formData.append(
        "file",
        file
      );


      formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
      );


      const response =
        await fetch(
          uploadURL,
          {
            method: "POST",

            body: formData
          }
        );


      if (!response.ok) {

        const errorText =
          await response.text();

        console.error(
          "Cloudinary error:",
          errorText
        );

        throw new Error(
          "Cloudinary upload failed."
        );

      }


      const data =
        await response.json();


      return {

        url:
          data.secure_url,

        type:
          resourceType

      };

    }


    /* =================================================
       GET RATING
       ================================================= */

    function getSelectedRating() {

      const selected =
        document.querySelector(
          'input[name="rating"]:checked'
        );


      if (!selected) {

        return 0;

      }


      return Number(
        selected.value
      );

    }


    /* =================================================
       SUBMIT REVIEW
       ================================================= */

    submitButton.addEventListener(
      "click",
      async () => {


        const name =
          nameInput.value.trim();

        const role =
          roleInput.value.trim();

        const review =
          reviewInput.value.trim();

        const rating =
          getSelectedRating();


        /* VALIDATION */

        if (!name) {

          alert(
            "Please enter your name."
          );

          return;

        }


        if (!role) {

          alert(
            "Please enter your role."
          );

          return;

        }


        if (!rating) {

          alert(
            "Please select a rating."
          );

          return;

        }


        if (!review) {

          alert(
            "Please write your review."
          );

          return;

        }


        if (!auth.currentUser) {

          alert(
            "Authentication is not ready. Refresh the page."
          );

          return;

        }


        try {


          submitButton.disabled =
            true;


          submitButton.textContent =
            "Uploading...";


          /* UPLOAD MEDIA */

          const uploadedMedia = [];


          for (
            let i = 0;
            i < selectedMedia.length;
            i++
          ) {


            status.textContent =
              `Uploading media ${i + 1} of ${selectedMedia.length}...`;


            status.style.color =
              "#4285f4";


            const uploaded =
              await uploadMedia(
                selectedMedia[i]
              );


            uploadedMedia.push(
              uploaded
            );

          }


          /* SAVE TO FIRESTORE */

          status.textContent =
            "Saving your review...";


          await addDoc(
            collection(
              db,
              "reviews"
            ),
            {

              name:
                name,

              role:
                role,

              rating:
                rating,

              review:
                review,

              media:
                uploadedMedia,

              userId:
                auth.currentUser.uid,

              createdAt:
                serverTimestamp()

            }
          );


          /* RESET */

          nameInput.value =
            "";

          roleInput.value =
            "";

          reviewInput.value =
            "";


          selectedMedia =
            [];


          document
            .querySelectorAll(
              'input[name="rating"]'
            )
            .forEach(
              radio => {

                radio.checked =
                  false;

              }
            );


          renderMediaPreview();


          status.textContent =
            "✅ Review submitted successfully!";

          status.style.color =
            "#188038";


        } catch (error) {


          console.error(
            "Submit error:",
            error
          );


          status.textContent =
            "❌ Unable to submit review.";

          status.style.color =
            "#d93025";


        } finally {


          submitButton.disabled =
            false;


          submitButton.textContent =
            "Submit Review";

        }

      }
    );


    /* =================================================
       CREATE STARS
       ================================================= */

    function createStars(rating) {

      let stars =
        "";


      for (
        let i = 1;
        i <= 5;
        i++
      ) {

        if (
          i <= rating
        ) {

          stars +=
            "★";

        } else {

          stars +=
            "☆";

        }

      }


      return stars;

    }


    /* =================================================
       DATE
       ================================================= */

    function formatDate(timestamp) {

      if (!timestamp) {

        return "Just now";

      }


      try {

        const date =
          timestamp.toDate();


        return date.toLocaleDateString(
          undefined,
          {
            year: "numeric",

            month: "short",

            day: "numeric"
          }
        );

      } catch {

        return "Recently";

      }

    }


    /* =================================================
       DELETE REVIEW
       ================================================= */

    async function deleteReview(
      reviewId,
      button
    ) {


      const confirmed =
        confirm(
          "Are you sure you want to delete this review?"
        );


      if (!confirmed) {

        return;

      }


      try {


        button.disabled =
          true;


        button.textContent =
          "Deleting...";


        await deleteDoc(
          doc(
            db,
            "reviews",
            reviewId
          )
        );


      } catch (error) {


        console.error(
          "Delete error:",
          error
        );


        alert(
          "Unable to delete the review."
        );


        button.disabled =
          false;


        button.textContent =
          "🗑️ Delete Review";

      }

    }


    /* =================================================
       DISPLAY REVIEW MEDIA
       ================================================= */

    function displayMedia(
      mediaArray,
      container
    ) {


      if (
        !Array.isArray(
          mediaArray
        )
      ) {

        return;

      }


      mediaArray.forEach(
        media => {


          if (
            !media ||
            !media.url
          ) {

            return;

          }


          /* VIDEO */

          if (
            media.type === "video"
          ) {


            const video =
              document.createElement(
                "video"
              );


            video.src =
              media.url;


            video.controls =
              true;


            video.preload =
              "metadata";


            container.appendChild(
              video
            );


          }


          /* IMAGE */

          else {


            const image =
              document.createElement(
                "img"
              );


            image.src =
              media.url;


            image.alt =
              "Customer review photo";


            image.loading =
              "lazy";


            image.addEventListener(
              "click",
              () => {

                window.open(
                  media.url,
                  "_blank"
                );

              }
            );


            container.appendChild(
              image
            );

          }

        }
      );

    }


    /* =================================================
       LOAD REVIEWS
       ================================================= */

    function loadReviews() {


      const reviewsQuery =
        query(
          collection(
            db,
            "reviews"
          ),

          orderBy(
            "createdAt",
            "desc"
          )
        );


      onSnapshot(
        reviewsQuery,


        snapshot => {


          reviewsList.innerHTML =
            "";


          /* NO REVIEWS */

          if (
            snapshot.empty
          ) {


            reviewsList.innerHTML = `

              <div class="empty-message">

                <h3>
                  No reviews yet
                </h3>

                <p>
                  Be the first person to leave a review!
                </p>

              </div>

            `;


            averageRating.textContent =
              "0.0";


            averageStars.textContent =
              "☆☆☆☆☆";


            reviewCount.textContent =
              "0 reviews";


            return;

          }


          /* AVERAGE */

          let totalRating =
            0;


          snapshot.forEach(
            reviewDoc => {


              const data =
                reviewDoc.data();


              totalRating +=
                Number(
                  data.rating || 0
                );

            }
          );


          const average =
            totalRating /
            snapshot.size;


          averageRating.textContent =
            average.toFixed(1);


          averageStars.textContent =
            createStars(
              Math.round(
                average
              )
            );


          reviewCount.textContent =
            `${snapshot.size} ${
              snapshot.size === 1
                ? "review"
                : "reviews"
            }`;


          /* DISPLAY REVIEWS */

          snapshot.forEach(
            reviewDoc => {


              const data =
                reviewDoc.data();


              const card =
                document.createElement(
                  "div"
                );


              card.className =
                "review-card";


              /* TOP */

              const top =
                document.createElement(
                  "div"
                );


              top.className =
                "review-top";


              /* AVATAR */

              const avatar =
                document.createElement(
                  "div"
                );


              avatar.className =
                "avatar";


              avatar.textContent =
                (
                  data.name ||
                  "U"
                )
                .charAt(0)
                .toUpperCase();


              /* USER INFO */

              const userInfo =
                document.createElement(
                  "div"
                );


              const reviewerName =
                document.createElement(
                  "div"
                );


              reviewerName.className =
                "reviewer-name";


              reviewerName.textContent =
                data.name ||
                "Anonymous";


              const reviewerRole =
                document.createElement(
                  "div"
                );


              reviewerRole.className =
                "reviewer-role";


              reviewerRole.textContent =
                data.role ||
                "";


              userInfo.appendChild(
                reviewerName
              );


              userInfo.appendChild(
                reviewerRole
              );


              /* DATE */

              const date =
                document.createElement(
                  "div"
                );


              date.className =
                "review-date";


              date.textContent =
                formatDate(
                  data.createdAt
                );


              top.appendChild(
                avatar
              );


              top.appendChild(
                userInfo
              );


              top.appendChild(
                date
              );


              card.appendChild(
                top
              );


              /* STARS */

              const stars =
                document.createElement(
                  "div"
                );


              stars.className =
                "review-stars";


              stars.textContent =
                createStars(
                  Number(
                    data.rating ||
                    0
                  )
                );


              card.appendChild(
                stars
              );


              /* TEXT */

              const text =
                document.createElement(
                  "div"
                );


              text.className =
                "review-text";


              text.textContent =
                data.review ||
                "";


              card.appendChild(
                text
              );


              /* MEDIA */

              if (
                Array.isArray(
                  data.media
                ) &&
                data.media.length > 0
              ) {


                const mediaContainer =
                  document.createElement(
                    "div"
                  );


                mediaContainer.className =
                  "review-media";


                displayMedia(
                  data.media,
                  mediaContainer
                );


                card.appendChild(
                  mediaContainer
                );

              }


              /* DELETE ONLY OWN REVIEW */

              if (
                auth.currentUser &&
                data.userId ===
                  auth.currentUser.uid
              ) {


                const deleteButton =
                  document.createElement(
                    "button"
                  );


                deleteButton.type =
                  "button";


                deleteButton.className =
                  "delete-review";


                deleteButton.textContent =
                  "🗑️ Delete Review";


                deleteButton.addEventListener(
                  "click",
                  () => {

                    deleteReview(
                      reviewDoc.id,
                      deleteButton
                    );

                  }
                );


                card.appendChild(
                  deleteButton
                );

              }


              reviewsList.appendChild(
                card
              );

            }
          );

        },


        error => {


          console.error(
            "Firestore error:",
            error
          );


          reviewsList.innerHTML = `

            <div class="empty-message">

              <h3>
                Unable to load reviews
              </h3>

              <p>
                Please refresh the page and try again.
              </p>

            </div>

          `;

        }

      );

    }


    /* =================================================
       START APPLICATION
       ================================================= */

    async function startApp() {


      await startAuthentication();


      if (
        auth.currentUser
      ) {

        loadReviews();

      }

    }


    startApp();

  </script>
